<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HiddenPerks</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Baloo+2:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#1a0d40">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="HiddenPerks">
    <link rel="apple-touch-icon" href="/icons/icon.svg">
  </head>
  <body>
    <main class="page-shell">
      <header class="hero-card">
        <img class="hero-image" src="hidden-perks-logo-2.jpg" alt="Hidden Perks logo" />
        <p class="hero-subtitle">UNCOVER HIDDEN SENIOR DISCOUNTS</p>
      </header>
      <div class="hero-badge-row">
        <span class="hero-badge">FREE — NO LOGIN NECESSARY</span>
      </div>

      <section class="panel search-panel">
        <div class="search-copy">
          <h2>Search Businesses</h2>
          <p>Type a business name or choose a category:</p>
        </div>
        <form id="searchForm" class="search-form">
          <select id="categoryFilter" class="category-select">
            <option value="">All Categories</option>
            <option value="restaurant">Restaurants</option>
            <option value="retail">Retail &amp; Shopping</option>
            <option value="pharmacy">Pharmacy</option>
            <option value="grocery">Grocery</option>
            <option value="entertainment">Entertainment</option>
            <option value="travel">Travel &amp; Hotels</option>
          </select>
          <div class="search-row">
            <input id="queryInput" name="q" type="search" placeholder="e.g. Denny's, Kohl's, CVS, AMC..." />
            <button type="submit">Find My Discount</button>
          </div>
        </form>
      </section>

      <section class="panel results-panel">
        <div class="panel-heading-row">
          <div>
            <p class="eyebrow">Results</p>
            <h2>Discount details</h2>
          </div>
          <span id="resultCount" class="pill">0 results</span>
        </div>
        <div id="resultsList" class="results-grid" aria-live="polite"></div>
      </section>

    </main>

    <!-- PWA install banner (shown automatically when installable) -->
    <div id="installBanner" class="install-banner" hidden>
      <span class="install-text">Add HiddenPerks to your home screen for quick access</span>
      <button type="button" id="installBtn" class="install-btn">Add to Home Screen</button>
      <button type="button" id="installDismiss" class="install-dismiss" aria-label="Dismiss">✕</button>
    </div>

    <!-- Ask For Me modal -->
    <div id="askModal" class="modal-overlay" hidden aria-modal="true" role="dialog" aria-labelledby="askModalTitle">
      <div class="modal-card">
        <div class="modal-header">
          <h2 id="askModalTitle">Share Discount</h2>
          <button type="button" class="modal-close" id="closeAsk" aria-label="Close">✕</button>
        </div>
        <p class="modal-hint">Copy, text, or show this discount summary:</p>
        <div class="modal-script" id="askScript" aria-live="polite"></div>
        <div class="modal-actions">
          <button type="button" id="btnShow" class="btn-show">Show to Cashier</button>
          <button type="button" id="btnCopy" class="btn-copy">Copy</button>
          <button type="button" id="btnText" class="btn-text">Text</button>
        </div>
      </div>
    </div>

    <!-- Full-screen show mode — plain white, big text for cashier to read -->
    <div id="showMode" class="show-overlay" hidden>
      <div class="show-content">
        <div class="show-script" id="showScript"></div>
        <button type="button" class="show-close" id="closeShow">Tap to Go Back</button>
      </div>
    </div>

    <script src="app.js"></script>

    <!-- PWA: register service worker -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js'));
      }
    </script>
  </body>
</html>
