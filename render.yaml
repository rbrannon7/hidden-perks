services:
  - type: web
    name: hiddenperks
    env: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: DATA_DIR
        value: /var/data
    disk:
      name: hiddenperks-data
      mountPath: /var/data
      sizeGB: 1
